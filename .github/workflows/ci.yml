name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r lint

      - run: pnpm --filter @racktrack/ui typecheck

      - run: pnpm --filter @racktrack/ui build-storybook

      - run: pnpm --filter @racktrack/web test

      - run: pnpm --filter @racktrack/web build
